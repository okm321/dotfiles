nerdfont: true
agent: claude

# workmux の panes は「直前 pane を split」 仕様しか無いため、
# 上を左右 + 下を左右の 4 ペインは panes 配列だけでは作れない。
# focus pane の command で tmux 直叩きして残りのペインを構築する。
#
#   構成 (高さ 上 75% / 下 25% 、 横は 上 70/30 ・ 下 50/50):
#   ┌──────────────┬──────┐
#   │     nvim     │ chat │
#   ├──────────┬───┴──────┤
#   │    sh    │    sh    │
#   └──────────┴──────────┘
panes:
  - command: ide
    focus: true

worktree_naming: basename

files:
  symlink:
    - .claude/lseettings.local.json
