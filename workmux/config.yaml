nerdfont: true
agent: claude

# ide = ~/dotfiles/bin/ide (nvim 上 75% / 下 sh 50・50)。alias だと zsh-defer の遅延読込に間に合わない
panes:
  - command: ide
    focus: true

# workmux add --pr の時は ~/dotfiles/bin/workmux の shim が -l pr を付ける (右上の claude が /pr-review を流す)
layouts:
  # -p/-P でプロンプトを渡した時 (/worktree スキル等)。shim が自動で -l agent を付ける
  agent:
    panes:
      - command: <agent>
        focus: true
      - split: vertical
        percentage: 25
  pr:
    panes:
      - command: ide --pr
        focus: true

worktree_naming: basename

files:
  symlink:
    - .claude/settings.local.json
