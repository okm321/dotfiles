# npm tool / LSP
"npm:typescript" = "5"  # 7 系は tsserver が無い
"npm:typescript-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:stylelint-lsp" = "latest"
"npm:graphql-language-service-cli" = "latest"
"npm:@vue/language-server" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:sql-formatter" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:@antfu/ni" = "latest"
"npm:yarn" = "latest"  # registry の yarn は berry になるので classic のまま
"npm:@google/gemini-cli" = "latest"
"npm:css-variables-language-server" = "latest"
"npm:cssmodules-language-server" = "latest"
"npm:git-cz" = "latest"
"npm:git-split-diffs" = "latest"
"npm:@aikidosec/safe-chain" = "latest"
"npm:@github/copilot-language-server" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:@openai/codex" = "latest"
"npm:ccstatusline" = "latest"  # Claude Code statusline (設定は ~/dotfiles/ccstatusline/settings.json)
"npm:vercel" = "latest"

[settings]
idiomatic_version_file = true
