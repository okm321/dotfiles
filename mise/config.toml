[tools]
node = "lts"

# Nix にない or 新興 AI tool 系のみ mise で管理
# (定番ツール 19 個は ~/dotfiles/nix/modules/home/packages.nix に移行済み)
# (netlify-cli, ts-node, cz-conventional-changelog, sql-formatter-cli,
#  @vue/typescript-plugin は使ってないため削除)
"npm:css-variables-language-server" = "latest"
"npm:cssmodules-language-server" = "latest"
"npm:git-cz" = "latest"
"npm:git-split-diffs" = "latest"
"npm:lehre" = "latest"
"npm:@aikidosec/safe-chain" = "latest"
"npm:@github/copilot-language-server" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:@openai/codex" = "latest"  # nixpkgs は 1〜2 週遅れるので最新追従のため mise
"npm:ccstatusline" = "latest"  # Claude Code statusline (設定は ~/dotfiles/ccstatusline/settings.json)
"npm:vercel" = "latest"  # nixpkgs 26.05 で nodePackages ごと削除された

[settings]
idiomatic_version_file = true
