fd = "latest"
fzf = "latest"
delta = "latest"
gitleaks = "latest"
jq = "latest"
lazygit = "latest"
lsd = "latest"
neovim = "latest"
ripgrep = "latest"
stylua = "latest"
tree-sitter = "latest"
yazi = "latest"
zoxide = "latest"
"github:k1LoW/mo" = "latest"  # tap は Linux 向け formula の定義エラーで tap できない

# 開発 / インフラ
